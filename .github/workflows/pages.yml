name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/unsolved-problems-test.log || {
            {
              echo "### npm test failure"
              echo '```text'
              tail -n 120 /tmp/unsolved-problems-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            last_error="$(grep -E 'Error:|Assertion|ERR_|failed|incomplete|changed' /tmp/unsolved-problems-test.log | tail -n 1 || true)"
            echo "::error title=npm test failed::${last_error:-See workflow summary for the final 120 log lines.}"
            exit 1
          }

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
